<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Conduit Stats</title>
<style>
  body { font-family: system-ui; background: #1a1a2e; color: #e0e0e0; margin: 20px; }
  .card { background: #16213e; border-radius: 8px; padding: 16px; margin: 8px 0; }
  .stat { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #0f3460; }
  .stat:last-child { border-bottom: none; }
  .value { color: #00d4ff; font-weight: bold; }
  h2 { color: #e94560; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px; text-align: left; border-bottom: 1px solid #0f3460; }
</style></head><body>
<h2>Conduit Statistics</h2>
<div class="card">
  <div class="stat"><span>Uptime</span><span class="value" id="uptime">--</span></div>
  <div class="stat"><span>Connections</span><span class="value" id="connections">0</span></div>
  <div class="stat"><span>Active</span><span class="value" id="active">0</span></div>
  <div class="stat"><span>Bytes In</span><span class="value" id="bytesIn">0</span></div>
  <div class="stat"><span>Bytes Out</span><span class="value" id="bytesOut">0</span></div>
</div>
<h3>Top Domains</h3>
<div class="card">
  <table><thead><tr><th>Domain</th><th>Hits</th></tr></thead><tbody id="domains"></tbody></table>
</div>
<script>
function formatBytes(b) { if (b<1024) return b+' B'; if (b<1048576) return (b/1024).toFixed(1)+' KB'; return (b/1048576).toFixed(1)+' MB'; }
function formatDuration(d) { var h=Math.floor(d/3600), m=Math.floor((d%3600)/60), s=Math.floor(d%60); return h+'h '+m+'m '+s+'s'; }
function refresh() {
  if (window.wails && window.wails.Events) {
    window.wails.Events.Emit("stats:fetch", {});
  }
}
window.__stats_update = function(data) {
  document.getElementById('uptime').textContent = formatDuration(data.uptime);
  document.getElementById('connections').textContent = data.connections;
  document.getElementById('active').textContent = data.activeConns;
  document.getElementById('bytesIn').textContent = formatBytes(data.bytesIn);
  document.getElementById('bytesOut').textContent = formatBytes(data.bytesOut);
  var tbody = document.getElementById('domains');
  tbody.innerHTML = '';
  var domains = Object.entries(data.domainHits || {}).sort(function(a,b){return b[1]-a[1]}).slice(0,20);
  domains.forEach(function(d) {
    var tr = document.createElement('tr');
    tr.innerHTML = '<td>'+d[0]+'</td><td>'+d[1]+'</td>';
    tbody.appendChild(tr);
  });
};
setInterval(refresh, 2000);
refresh();
</script></body></html>
