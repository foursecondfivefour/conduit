name: CI

on:
  push:
    branches: [main]
    tags-ignore:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOFLAGS: "-trimpath"

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: Generate Windows resources
        run: go generate ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m ./...

      - name: Vet
        run: go vet ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  test:
    needs: lint
    runs-on: windows-latest
    strategy:
      matrix:
        go: ["1.24", "1.25"]
    name: Go ${{ matrix.go }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: Generate Windows resources
        run: go generate ./...

      - name: Test
        run: go test ./... -v -count=1 -timeout=5m

      - name: Test (race detector)
        run: go test -race ./... -count=1 -timeout=10m

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: Generate Windows resources
        run: go generate ./...

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = & ./.github/scripts/read-version.ps1
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build conduit (max optimization)
        shell: pwsh
        run: go build -trimpath -ldflags="-s -w -H=windowsgui -buildid= -X github.com/foursecondfivefour/conduit/internal/config.Version=${{ steps.ver.outputs.version }}" -tags production -o build/conduit.exe .

      - name: Build updater (max optimization)
        shell: pwsh
        run: go build -trimpath -ldflags="-s -w -H=windowsgui -buildid=" -tags production -o build/conduit-updater.exe ./cmd/conduit-updater

      - name: Verify binary
        shell: pwsh
        run: go version -m build/conduit.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries-${{ steps.ver.outputs.version }}
          path: |
            build/conduit.exe
            build/conduit-updater.exe
          retention-days: 7
